<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #1b1b1f;
      --muted: #6b6b73;
      --field: #f2f2f5;
      --hover: rgba(0, 0, 0, .05);
      --selected: rgba(144, 89, 255, .14);
      --accent: #9059ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b21;
        --fg: #ecebf0;
        --muted: #8f8e99;
        --field: #2a2930;
        --hover: rgba(255, 255, 255, .06);
        --selected: rgba(144, 89, 255, .28);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 520px;
      padding: 10px;
      font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 42px;
      border-radius: 21px;
      background: var(--field);
    }
    .field svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
    input {
      all: unset;
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 17px;
      color: var(--fg);
    }
    input::placeholder { color: var(--muted); }
    .count { font-size: 12px; color: var(--muted); white-space: nowrap; }
    ul {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      /* Firefox caps popups at 600px; the field takes the rest. */
      max-height: 528px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--fg) 25%, transparent) transparent;
    }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: default;
    }
    li:hover { background: var(--hover); }
    li.selected { background: var(--selected); }
    li img {
      width: 18px; height: 18px; flex: none;
      border-radius: 4px;
      object-fit: contain;
    }
    li .text { flex: 1; min-width: 0; display: grid; }
    li .title, li .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .url { font-size: 12px; color: var(--muted); }
    li .close {
      all: unset;
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px;
      font-size: 18px; line-height: 1;
      color: var(--muted);
      visibility: hidden;
      cursor: pointer;
    }
    li:hover .close, li.selected .close { visibility: visible; }
    li .close:hover { background: var(--hover); color: var(--fg); }
    li.active .title::after { content: " · atual"; color: var(--muted); font-size: 12px; }
    li .audible { width: 14px; height: 14px; color: var(--muted); flex: none; }
    .empty { padding: 18px 10px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="field">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="q" type="text" placeholder="Buscar aba…" autocomplete="off" spellcheck="false" autofocus>
    <span class="count" id="count"></span>
  </div>
  <ul id="list"></ul>
  <template id="audible">
    <span class="audible" title="Tocando som"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h2.5L9 3v10L5.5 10H3zM11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></span>
  </template>
  <script src="popup.js"></script>
</body>
</html>
